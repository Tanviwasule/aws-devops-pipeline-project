version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    REPOSITORY_URI: 273960310876.dkr.ecr.us-east-1.amazonaws.com/myecsapp1
    CONTAINER_NAME: myecs-container

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)

  build:
    commands:
      - echo Building Docker image...
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker push $REPOSITORY_URI:$IMAGE_TAG

  post_build:
    commands:
      - echo "Starting image scan..."
      - aws ecr start-image-scan \
          --repository-name simple-docker-service-1233bc5a8f7d \
          --image-id imageTag=$IMAGE_TAG

      - echo "Waiting for scan to complete..."
      - aws ecr wait image-scan-complete \
          --repository-name simple-docker-service-1233bc5a8f7d \
          --image-id imageTag=$IMAGE_TAG

      - echo "Checking CRITICAL vulnerabilities..."
      - CRITICAL=$(aws ecr describe-image-scan-findings \
          --repository-name simple-docker-service-1233bc5a8f7d \
          --image-id imageTag=$IMAGE_TAG \
          --query 'imageScanFindings.findingCounts.CRITICAL' \
          --output text)

      - echo "CRITICAL count: $CRITICAL"

      - |
        if [ "$CRITICAL" != "0" ]; then
          echo "❌ CRITICAL vulnerabilities found. Failing build."
          exit 1
        fi

      - echo Creating imagedefinitions.json...
      - printf '[{"name":"%s","imageUri":"%s"}]' $CONTAINER_NAME $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
